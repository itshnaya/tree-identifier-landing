//   "[À CONFIRMER]"                → information missing
//   "[À CONFIRMER] proposed text"  → Claude's proposal, waiting for Claire's "yes"
// Both count as "to confirm". In preview/dev they show with a gold badge;
// in production they are hidden (see src/lib/mode.js).
const TBC = '[À CONFIRMER]';

/** True when a value is missing or still marked [À CONFIRMER]. */
function isTBC(value) {
  if (value === undefined || value === null) return true;
  if (typeof value === 'string') return value.trim() === '' || value.includes(TBC);
  return false;
}

/** The proposed text after the marker ('' when there is no proposal). */
function proposalOf(value) {
  if (typeof value !== 'string' || !value.includes(TBC)) return '';
  return value.replace(TBC, '').trim();
}

/** Recursively lists every content path whose value is [À CONFIRMER]. */
function findTBC(obj, path = '') {
  const out = [];
  if (typeof obj === 'string') {
    if (obj.includes(TBC)) out.push(path);
  } else if (Array.isArray(obj)) {
    obj.forEach((v, i) => out.push(...findTBC(v, `${path}[${i}]`)));
  } else if (obj && typeof obj === 'object') {
    for (const [k, v] of Object.entries(obj)) out.push(...findTBC(v, path ? `${path}.${k}` : k));
  }
  return out;
}

// Store link builder used by /get (browser) and by the tests (Node).
// Pure functions only: no DOM access here.


/** Keeps campaign values short and safe: lowercase letters, digits, - and _. */
function cleanParam(value, fallback) {
  const v = String(value ?? '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40);
  return v || fallback;
}

/** "ios" | "android" | "desktop" from a user agent (+ optional touch hint for iPadOS). */
function detectPlatform(userAgent = '', maxTouchPoints = 0) {
  const ua = String(userAgent);
  if (/android/i.test(ua)) return 'android';
  if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
  // iPadOS 13+ reports itself as a Mac; a Mac with a touch screen is an iPad.
  if (/macintosh/i.test(ua) && maxTouchPoints > 1) return 'ios';
  return 'desktop';
}

/** App Store link with Apple campaign parameters pt (provider token) and ct (campaign). */
function appStoreUrl(iosUrl, providerToken, series, network) {
  if (isTBC(iosUrl)) return null;
  const u = new URL(iosUrl);
  if (!isTBC(providerToken)) u.searchParams.set('pt', providerToken);
  u.searchParams.set('ct', `${series}_${network}`);
  u.searchParams.set('mt', '8');
  return u.toString();
}

/** Google Play link with an install referrer carrying UTM parameters. */
function googlePlayUrl(androidUrl, series, network) {
  if (isTBC(androidUrl)) return null;
  const u = new URL(androidUrl);
  const referrer = `utm_source=${network}&utm_medium=organic&utm_campaign=${series}`;
  // URLSearchParams encodes "=" as %3D and "&" as %26, as Google Play expects.
  u.searchParams.set('referrer', referrer);
  return u.toString();
}

/**
 * Decides where /get sends the visitor.
 * @returns {{platform: string, series: string, network: string, url: string|null}}
 * url === null means: show the fallback page (badges + QR code).
 */
function resolveGet({ search = '', userAgent = '', maxTouchPoints = 0, stores }) {
  const q = new URLSearchParams(search);
  const series = cleanParam(q.get('s'), 'direct');
  const network = cleanParam(q.get('p'), 'direct');
  const forced = q.get('to');
  const platform = forced === 'ios' || forced === 'android' ? forced : detectPlatform(userAgent, maxTouchPoints);
  let url = null;
  if (platform === 'ios') url = appStoreUrl(stores.ios_url, stores.apple_provider_token, series, network);
  if (platform === 'android') url = googlePlayUrl(stores.android_url, series, network);
  return { platform, series, network, url };
}

// Privacy-friendly, cookieless analytics (Plausible Events API by default).
// Disabled until /content/site.json → analytics.enabled = true and domain set.
// sendBeacon never delays navigation.
function makeTracker(cfg) {
  const ok = cfg && cfg.enabled && cfg.domain && !String(cfg.domain).includes('[À CONFIRMER]');

    if (!ok) return false;
    try {

const stores = JSON.parse(document.getElementById('get-stores').textContent);
const track = makeTracker(JSON.parse(document.getElementById('analytics-config')?.textContent || '{}'));
const r = resolveGet({ search: location.search, userAgent: navigator.userAgent, maxTouchPoints: navigator.maxTouchPoints || 0, stores });

if (r.url) {
  track('store_click', { os: r.platform, series: r.series, network: r.network, from: 'get' }); // beacon: non-blocking
